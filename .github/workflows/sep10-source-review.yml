name: September 10 production verification
on:
  push:
    branches: [review-sep10-fulltext]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sep10-production-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/review-sep10-fulltext'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9ecd028086ce328a17e592d4f003efcf097e5fc6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Verify live custom domain with all approved content and controls
        run: |
          mkdir -p production-review
          git rev-parse HEAD > production-review/deployed-commit.txt
          python docs/reviews/2026-09-10/browser-check.py --base-url https://papers.lucajiang.com --output production-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep10-production-browser-review
          path: production-review/
          retention-days: 7
