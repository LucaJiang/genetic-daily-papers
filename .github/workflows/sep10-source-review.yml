name: September 10 source review
on:
  push:
    branches: [review-sep10-fulltext]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pymupdf
      - run: python docs/reviews/2026-09-10/fetch-sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep10-primary-sources
          path: .source-review/
          include-hidden-files: true
          retention-days: 2
