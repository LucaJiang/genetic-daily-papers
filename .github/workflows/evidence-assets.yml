name: Verify review sources
on:
  push:
    branches: [research-alignment-2026-09-05]
    paths: ['.github/workflows/evidence-assets.yml']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Retrieve public sources
        run: |
          mkdir -p evidence
          python - <<'PY'
          import urllib.request, json, concurrent.futures
          from pathlib import Path
          urls = {
            'abprs.pdf':'https://www.nature.com/articles/s41467-026-77128-5_reference.pdf',
            'sce2g.pdf':'https://www.nature.com/articles/s41588-026-02695-8.pdf',
            'ldspec.html':'https://pmc.ncbi.nlm.nih.gov/articles/PMC13479724/',
            'imputation.pdf':'https://www.medrxiv.org/content/10.64898/2026.08.25.26361247v1.full.pdf',
            'imputation.html':'https://www.medrxiv.org/content/10.64898/2026.08.25.26361247v1.full',
          }
          for name, ident, figs in [('sce2g','41588_2026_2695',[2,5]),('ldspec','41588_2026_2712',[2,6]),('abprs','41467_2026_77128',[3,7])]:
              doi={'sce2g':'s41588-026-02695-8','ldspec':'s41588-026-02712-w','abprs':'s41467-026-77128-5'}[name]
              for n in figs:
                  urls[f'{name}-fig{n}.png']=f'https://media.springernature.com/full/springer-static/image/art%3A10.1038%2F{doi}/MediaObjects/{ident}_Fig{n}_HTML.png'
          def download(item):
              name,url=item
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
                  with urllib.request.urlopen(request,timeout=45) as r:
                      data=r.read(); content_type=r.headers.get('Content-Type','')
                  Path('evidence',name).write_bytes(data)
                  return {'name':name,'url':url,'bytes':len(data),'content_type':content_type}
              except Exception as e:
                  return {'name':name,'url':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results=list(pool.map(download,urls.items()))
          Path('evidence/manifest.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: review-evidence
          path: evidence
          retention-days: 2
