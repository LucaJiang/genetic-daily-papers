name: September 15 final review build
on:
  push:
    branches: [research-2026-09-15]
    paths: [.github/workflows/review-sept15.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize new review metadata and finalize source scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('src/content/papers/splendid-continuous-ancestry.md')
          raw=p.read_text();_,fm,body=raw.split('---',2);m=json.loads(fm)
          m['topics']=['polygenic-prediction','statistical-genetics','QTL','statistical-methods','algorithm-acceleration']
          body=body.replace('(../aou-multiancestry-prs-context/)', '(/papers/aou-multiancestry-prs-context/)')
          p.write_text('---\n'+json.dumps(m,ensure_ascii=False,indent=2)+'\n---'+body)
          p=Path('src/content/papers/proximal-variant-pairs-mpra.md')
          raw=p.read_text();old='独立补充材料另作获取与核验，本文不将正文对表 S1–S7 的引用写成已逐行重算的证据。'
          assert old in raw
          raw=raw.replace(old,'独立补充材料下载返回 HTTP 429，未成功取得，因此表 S1–S7 和独立补图没有逐项核验；涉及它们的结果仅按主文报告，不当作已经完成的实现审查。')
          p.write_text(raw)
          PY
      - name: Record exact reviewed source commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/papers/splendid-continuous-ancestry.md src/content/papers/proximal-variant-pairs-mpra.md
          if ! git diff --cached --quiet; then
            git commit -m 'review: align topic taxonomy and state MPRA supplement access limit'
            git push origin HEAD:research-2026-09-15
          fi
          mkdir -p /tmp/review-output
          git rev-parse HEAD > /tmp/review-output/review-commit.txt
          git rev-parse HEAD^{tree} > /tmp/review-output/review-tree.txt
      - run: npm ci --no-audit --no-fund
      - name: Build and validate all site content
        run: npm run build 2>&1 | tee /tmp/review-output/build.log
      - name: Export verified source
        run: tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.astro -czf /tmp/review-output/source.tgz .
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sept15-reviewed-dist
          path: dist
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sept15-reviewed-evidence
          path: /tmp/review-output
          retention-days: 1
