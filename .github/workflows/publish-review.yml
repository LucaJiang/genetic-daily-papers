name: Publish review validation
on:
  push:
    branches: [publish-reviewed-2026-09-05]
permissions:
  contents: read
concurrency:
  group: publish-reviewed-2026-09-05
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish-reviewed-2026-09-05
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve reviewed legacy entries
        run: python scripts/migrate-reviewed-legacy.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and validate
        run: npm run build
      - name: Save verified source assets on review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json public/figures src/content
          if ! git diff --cached --quiet; then
            git commit -m 'build: pin dependencies and verified publisher figures'
            git push origin HEAD:publish-reviewed-2026-09-05
          fi
          mkdir -p qa
          git rev-parse HEAD > qa/commit.txt
          cp .radar/figure-check.json qa/figure-check.json
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.astro --exclude=.radar --exclude=qa -czf /tmp/review-source.tgz .
          cp /tmp/review-source.tgz qa/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-site-build
          path: |
            dist/
            qa/
            .radar/figure-check.json
          include-hidden-files: true
          retention-days: 2
