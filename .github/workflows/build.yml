name: Astro build and content checks
on:
  push:
    branches: [master, 'site-v*', 'fix-*', 'research-*']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and validate site
        run: npm run build
      - name: Export reviewable source
        if: success()
        run: tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.astro --exclude=public/figures -czf /tmp/site-source.tgz .
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: site-dist
          path: dist
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: site-source
          path: /tmp/site-source.tgz
          retention-days: 2
