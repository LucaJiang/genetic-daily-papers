name: September 14 isolated publication review
on:
  push:
    branches: [review-sep14-papers]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4
      - name: Retrieve official article assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests, json, hashlib, time
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          out=Path('source-assets');out.mkdir(exist_ok=True)
          records=[]
          for key,doi,date in [('alpha','2026.09.08.750172','2026/09/11'),('mikado','2026.09.10.750583','2026/09/12')]:
              urls=[f'https://api.biorxiv.org/details/biorxiv/10.64898/{doi}',f'https://www.biorxiv.org/content/10.64898/{doi}v1.full',f'https://www.biorxiv.org/content/biorxiv/early/{date}/{doi}/F1.large.jpg',f'https://www.biorxiv.org/content/biorxiv/early/{date}/{doi}/F1.large.png']
              for n,url in enumerate(urls):
                  rec={'key':key,'url':url}
                  try:
                      r=requests.get(url,timeout=60,headers={'User-Agent':'Mozilla/5.0'})
                      rec.update(status=r.status_code,type=r.headers.get('Content-Type'),bytes=len(r.content),resolvedUrl=r.url)
                      if r.ok:
                          name=f'{key}-{n}.bin';(out/name).write_bytes(r.content);rec['file']=name
                          if 'html' in r.headers.get('Content-Type',''):
                              soup=BeautifulSoup(r.content,'html.parser')
                              rec['links']=[urljoin(r.url,a.get('href') or a.get('src')) for a in soup.select('a[href],img[src]') if any(x in (a.get('href') or a.get('src') or '') for x in ['large','pdf','fig','fig-','graphic'])]
                      print(json.dumps(rec),flush=True)
                  except Exception as e:rec['error']=str(e);print(str(e),flush=True)
                  records.append(rec);time.sleep(5)
          (out/'manifest.json').write_text(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep14-official-assets
          path: source-assets/
          retention-days: 2
