name: September 14 isolated publication review
on:
  push:
    branches: [review-sep14-papers]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: review-sep14
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install pymupdf==1.26.7 requests
      - name: Retrieve version-pinned public primary PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, requests, time
          out = Path('.source-review-sep14'); out.mkdir(exist_ok=True)
          sources = [
            ('alpha', 'www.biorxiv.org', '2026.09.08.750172', '2026/09/11', '2d94bcfe47ad5b8870c92f56e498e3042b2753e97f9db23a62e74c9f57fc1333'),
            ('mikado', 'www.biorxiv.org', '2026.09.10.750583', '2026/09/12', 'ee1e51d44c58db3555bbecbe207cf45c9dca41aefba547f3c68ef09e7d6368c4'),
            ('mitotic', 'www.medrxiv.org', '2026.09.08.26362505', '2026/09/09', '969d8aea27076eb64e704c1fa06b1272c729596e6cc53da87b285b9b2b688022')]
          records=[]
          for key, host, doi, date, expected in sources:
              canonical=f'https://{host}/content/10.64898/{doi}v1.full.pdf'
              urls=[canonical, canonical+'?download=1', f'https://{host}/content/{host.split(".")[1]}/early/{date}/{doi}.full.pdf']
              record={'id':key,'expectedSha256':expected,'attempts':[]}
              for url in urls:
                  try:
                      r=requests.get(url,timeout=90,headers={'User-Agent':'Mozilla/5.0'})
                      r.raise_for_status()
                      assert r.content.startswith(b'%PDF') and len(r.content)<60000000,'not a size-valid PDF'
                      actual=hashlib.sha256(r.content).hexdigest()
                      record.update(sha256=actual,bytes=len(r.content),resolvedUrl=r.url,matchesUploaded=(actual==expected))
                      (out/(key+'.pdf')).write_bytes(r.content)
                      print(key,actual,'matches uploaded:',actual==expected,flush=True)
                      break
                  except Exception as e:
                      record['attempts'].append({'url':url,'error':str(e)})
                      print(key,str(e),flush=True)
                      time.sleep(20)
              records.append(record)
              time.sleep(5)
          (out/'sources.json').write_text(json.dumps(records,indent=2))
          PY
      - name: Build current checkout
        run: npm run build
      - name: Export complete review environment
        if: always()
        run: tar --exclude=./.git --exclude=./.astro --exclude=./dist -czf /tmp/sep14-review-environment.tgz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sep14-review-environment
          path: /tmp/sep14-review-environment.tgz
          retention-days: 2
